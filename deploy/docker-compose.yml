services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: ["./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: fp, POSTGRES_PASSWORD: fp_dev_only, POSTGRES_DB: factorypulse }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  prometheus:
    image: prom/prometheus
    profiles: ["obs"]
    ports: ["9090:9090"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana
    profiles: ["obs"]
    ports: ["3000:3000"]
volumes:
  pgdata:
